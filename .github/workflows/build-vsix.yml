name: Build VSIX

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Package VSIX
        run: npx -y @vscode/vsce package --allow-missing-repository

      - name: Publish to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: main-snapshot
          name: Main Snapshot
          body: |
            Automated build from `main`.
            Commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: '*.vsix'
